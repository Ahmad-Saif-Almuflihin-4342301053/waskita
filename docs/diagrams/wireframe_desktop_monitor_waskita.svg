<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="720" viewBox="0 0 1760 720">

  <defs>
    <filter id="sketch" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <style>
      .bg { fill: #ffffff; }
      .device { fill: #ffffff; stroke: #111111; stroke-width: 3.2; }
      .screen { fill: #ffffff; stroke: #222222; stroke-width: 1.8; }
      .bar { fill: #f2f2f2; stroke: #222222; stroke-width: 1.4; }
      .box { fill: #ffffff; stroke: #222222; stroke-width: 1.5; }
      .box-fill { fill: #f5f5f5; stroke: #222222; stroke-width: 1.4; }
      .btn-dark { fill: #222222; stroke: #111111; stroke-width: 1.5; }
      .pill { fill: #efefef; stroke: #333333; stroke-width: 1.2; }
      .pill-active { fill: #222222; stroke: #111111; stroke-width: 1.2; }
      .txt-cap { font-family: "Liberation Sans", Arial, sans-serif; font-size: 14.5px; font-weight: bold; fill: #111111; }
      .txt-logo { font-family: "Liberation Sans", Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #111111; }
      .txt-h1 { font-family: "Liberation Sans", Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #111111; }
      .txt-h2 { font-family: "Liberation Sans", Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #111111; }
      .txt-b { font-family: "Liberation Sans", Arial, sans-serif; font-size: 11px; fill: #222222; }
      .txt-m { font-family: "Liberation Sans", Arial, sans-serif; font-size: 10px; fill: #555555; }
      .txt-w { font-family: "Liberation Sans", Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; }
      .txt-big { font-family: "Liberation Sans", Arial, sans-serif; font-size: 19px; font-weight: bold; fill: #111111; }
      .line { stroke: #333333; stroke-width: 1.3; }
      .wavy { stroke: #888888; stroke-width: 1.4; fill: none; }
    </style>
  </defs>

  <rect width="1760" height="720" class="bg"/>

  <!-- MONITOR 1: HALAMAN UTAMA + SIDEBAR -->
  <g transform="translate(40, 20)" filter="url(#sketch)">
    <!-- Monitor Outer Bezel -->
    <rect x="0" y="0" width="820" height="560" rx="18" class="device"/>
    <!-- Monitor Stand -->
    <path d="M 350 560 L 330 625 L 490 625 L 470 560 Z" class="box-fill"/>
    <rect x="280" y="625" width="260" height="14" rx="6" class="device"/>
    <!-- Inner Screen -->
    <rect x="18" y="18" width="784" height="500" rx="4" class="screen"/>

    <!-- Browser Bar -->
    <rect x="18" y="18" width="784" height="32" class="bar"/>
    <circle cx="34" cy="34" r="4" fill="#fff" stroke="#222"/>
    <circle cx="48" cy="34" r="4" fill="#fff" stroke="#222"/>
    <circle cx="62" cy="34" r="4" fill="#fff" stroke="#222"/>
    <rect x="84" y="24" width="520" height="20" rx="4" class="box"/>
    <text x="94" y="38" class="txt-m">http://localhost:5173 — WASKITA Mesin Audit Orisinalitas &amp; Kualitas Konten</text>

    <!-- Sidebar Kiri -->
    <rect x="18" y="50" width="176" height="468" class="box-fill"/>
    <text x="32" y="78" class="txt-h1">Waskita [BETA]</text>
    <rect x="30" y="92" width="152" height="30" rx="6" class="box"/>
    <text x="42" y="111" class="txt-b">[+] Analisis Baru</text>
    <text x="32" y="146" class="txt-m">RIWAYAT SESI PERCAKAPAN</text>
    <text x="32" y="186" class="txt-m">Belum ada riwayat sesi.</text>
    <text x="32" y="200" class="txt-m">Mulai analisis pertama Anda.</text>
    <line x1="18" y1="468" x2="194" y2="468" class="line"/>
    <circle cx="40" cy="493" r="13" class="btn-dark"/>
    <text x="40" y="497" text-anchor="middle" class="txt-w">A</text>
    <text x="60" y="490" class="txt-h2">author_demo</text>
    <text x="60" y="503" class="txt-m">PERSONAL PLAN</text>

    <!-- Main Workspace (Centered) -->
    <text x="498" y="138" text-anchor="middle" class="txt-logo">Waskita  [BETA]</text>
    <text x="498" y="168" text-anchor="middle" class="txt-big">Periksa Kualitas &amp; Orisinalitas Artikel</text>

    <!-- Floating Composer -->
    <rect x="256" y="192" width="484" height="106" rx="12" class="box"/>
    <text x="272" y="216" class="txt-m">Ketik atau tempel naskah artikel Anda...</text>
    <line x1="272" y1="234" x2="680" y2="234" class="wavy"/>
    <line x1="256" y1="254" x2="740" y2="254" stroke="#ccc" stroke-width="1"/>
    <circle cx="276" cy="276" r="11" class="box-fill"/>
    <text x="276" y="280" text-anchor="middle" class="txt-h2">+</text>
    <rect x="296" y="265" width="190" height="22" rx="11" class="pill"/>
    <text x="306" y="280" class="txt-m">Q "resep kopi tubruk tradisional"</text>
    <text x="664" y="280" text-anchor="end" class="txt-m">0 / 100 kata min</text>
    <circle cx="718" cy="276" r="12" class="btn-dark"/>
    <text x="718" y="280" text-anchor="middle" class="txt-w">^</text>

    <!-- 2 Sample Cards -->
    <rect x="256" y="316" width="484" height="58" rx="10" class="box-fill"/>
    <rect x="270" y="330" width="28" height="28" rx="6" class="box"/>
    <line x1="270" y1="330" x2="298" y2="358" stroke="#666"/>
    <line x1="298" y1="330" x2="270" y2="358" stroke="#666"/>
    <text x="310" y="343" class="txt-h2">Coba Draf Perlu Revisi — Resep Kopi Tubruk Tradisional</text>
    <text x="310" y="360" class="txt-m">Contoh artikel umum dengan defisit takaran suhu seduh &amp; rasio air (~700 kata)</text>

    <rect x="256" y="384" width="484" height="58" rx="10" class="box-fill"/>
    <rect x="270" y="398" width="28" height="28" rx="6" class="box"/>
    <line x1="270" y1="398" x2="298" y2="426" stroke="#666"/>
    <line x1="298" y1="398" x2="270" y2="426" stroke="#666"/>
    <text x="310" y="411" class="txt-h2">Coba Draf Layak Terbit — Robusta Dampit &amp; Takaran Seduh Presisi</text>
    <text x="310" y="428" class="txt-m">Contoh artikel dengan entitas unik lokal (CDS 85% Siap Terbit, ~700 kata)</text>
  </g>
  <text x="450" y="685" text-anchor="middle" class="txt-cap">(a) Tampilan Desktop — Halaman Utama &amp; Sidebar</text>

  <!-- MONITOR 2: HASIL ANALISIS & VONIS KELAYAKAN -->
  <g transform="translate(900, 20)" filter="url(#sketch)">
    <rect x="0" y="0" width="820" height="560" rx="18" class="device"/>
    <path d="M 350 560 L 330 625 L 490 625 L 470 560 Z" class="box-fill"/>
    <rect x="280" y="625" width="260" height="14" rx="6" class="device"/>
    <rect x="18" y="18" width="784" height="500" rx="4" class="screen"/>

    <!-- Browser Bar -->
    <rect x="18" y="18" width="784" height="32" class="bar"/>
    <circle cx="34" cy="34" r="4" fill="#fff" stroke="#222"/>
    <circle cx="48" cy="34" r="4" fill="#fff" stroke="#222"/>
    <circle cx="62" cy="34" r="4" fill="#fff" stroke="#222"/>
    <rect x="84" y="24" width="520" height="20" rx="4" class="box"/>
    <text x="94" y="38" class="txt-m">http://localhost:5173 — Sesi Audit Multi-Turn (Hasil Analisis #1)</text>

    <!-- Sidebar Kiri -->
    <rect x="18" y="50" width="176" height="468" class="box-fill"/>
    <text x="32" y="78" class="txt-h1">Waskita [BETA]</text>
    <rect x="30" y="92" width="152" height="30" rx="6" class="box"/>
    <text x="42" y="111" class="txt-b">[+] Analisis Baru</text>
    <text x="32" y="146" class="txt-m">RIWAYAT SESI PERCAKAPAN</text>
    <rect x="28" y="156" width="156" height="34" rx="6" class="box"/>
    <text x="36" y="177" class="txt-b">Draf: resep kopi tubruk...</text>
    <line x1="18" y1="468" x2="194" y2="468" class="line"/>
    <circle cx="40" cy="493" r="13" class="btn-dark"/>
    <text x="40" y="497" text-anchor="middle" class="txt-w">A</text>
    <text x="60" y="490" class="txt-h2">author_demo</text>
    <text x="60" y="503" class="txt-m">PERSONAL PLAN</text>

    <!-- User Bubble Top Right -->
    <rect x="526" y="62" width="256" height="58" rx="10" class="box-fill"/>
    <text x="538" y="80" class="txt-h2">DRAF AWAL • resep kopi tubruk...</text>
    <text x="538" y="96" class="txt-m">"resep kopi tubruk tradisional" | 726 kata</text>
    <text x="538" y="110" class="txt-m">&gt; Lihat Naskah Asli</text>

    <!-- Header Hasil + MD -->
    <text x="218" y="142" class="txt-h2">Hasil Analisis #1 • 07.34</text>
    <rect x="726" y="126" width="56" height="22" rx="5" class="box"/>
    <text x="754" y="141" text-anchor="middle" class="txt-m">[v] MD</text>

    <!-- VONIS KELAYAKAN Card -->
    <rect x="218" y="154" width="564" height="148" rx="12" class="box"/>
    <text x="234" y="176" class="txt-m">VONIS KELAYAKAN</text>
    <text x="234" y="196" class="txt-h1">(!) Perlu Revisi - Redundansi Kalimat Tinggi</text>
    <text x="234" y="216" class="txt-m">Draf memiliki kemiripan kalimat langsung dengan kompetitor SERP (&gt;= 20%).</text>
    <rect x="234" y="230" width="370" height="28" rx="5" class="box-fill"/>
    <text x="244" y="248" class="txt-m">Veto Redundansi Aktif: Rombak kalimat berstabilo merah.</text>
    <text x="234" y="284" class="txt-m">Komponen: VSM 24.5/35 • IG 29.1/30 • MATTR 20/20 • HKO 5/15</text>

    <!-- Gauge Right -->
    <path d="M 636 254 A 52 52 0 0 1 740 254" fill="none" stroke="#ddd" stroke-width="10" stroke-linecap="round"/>
    <path d="M 636 254 A 52 52 0 0 1 686 202" fill="none" stroke="#222" stroke-width="10" stroke-linecap="round"/>
    <text x="688" y="244" text-anchor="middle" class="txt-big">49%</text>
    <text x="688" y="264" text-anchor="middle" class="txt-m">Target Ambang: 75%</text>

    <!-- 7 Metrik Grid (4 Kolom) -->
    <text x="218" y="324" class="txt-h2">7 Metrik Evaluasi White-Box IR &amp; Stilometri</text>
    <rect x="218" y="334" width="134" height="64" rx="8" class="box"/>
    <text x="228" y="352" class="txt-m">Max Cosine Sim</text>
    <text x="228" y="378" class="txt-big">16.2%</text>

    <rect x="361" y="334" width="134" height="64" rx="8" class="box"/>
    <text x="371" y="352" class="txt-m">MATTR (L=50)</text>
    <text x="371" y="378" class="txt-big">86.0%</text>

    <rect x="504" y="334" width="134" height="64" rx="8" class="box"/>
    <text x="514" y="352" class="txt-m">HKO Overlap</text>
    <text x="514" y="378" class="txt-big">80%</text>

    <rect x="647" y="334" width="135" height="64" rx="8" class="box"/>
    <text x="657" y="352" class="txt-m">Euclidean Dist</text>
    <text x="657" y="378" class="txt-big">1.35</text>

    <!-- Bottom Floating Composer -->
    <rect x="218" y="420" width="564" height="82" rx="12" class="box"/>
    <text x="234" y="444" class="txt-m">Ketik atau tempel naskah revisi Anda...</text>
    <line x1="218" y1="458" x2="782" y2="458" stroke="#ccc" stroke-width="1"/>
    <circle cx="238" cy="480" r="11" class="box-fill"/>
    <text x="238" y="484" text-anchor="middle" class="txt-h2">+</text>
    <rect x="258" y="469" width="230" height="22" rx="11" class="pill"/>
    <text x="268" y="484" class="txt-m">Q "resep kopi tubruk..." • Turn #2</text>
    <text x="712" y="484" text-anchor="end" class="txt-m">0 / 100 kata min</text>
    <circle cx="758" cy="480" r="12" class="btn-dark"/>
    <text x="758" y="484" text-anchor="middle" class="txt-w">^</text>
  </g>
  <text x="1310" y="685" text-anchor="middle" class="txt-cap">(b) Tampilan Desktop — Hasil Analisis Multi-Turn &amp; Vonis</text>
</svg>
