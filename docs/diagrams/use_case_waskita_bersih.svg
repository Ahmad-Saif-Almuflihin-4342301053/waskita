<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960">
<defs>
  <style>
    .title { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #000000; text-anchor: start; }
    .subtitle { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13.5px; fill: #444444; text-anchor: start; }
    .bound-box { fill: #ffffff; stroke: #000000; stroke-width: 2.2; }
    .bound-hdr { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #000000; text-anchor: middle; }
    .uc-oval { fill: #ffffff; stroke: #000000; stroke-width: 2.0; }
    .uc-txt { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13.5px; font-weight: 700; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .actor-line { stroke: #000000; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .actor-head { fill: #ffffff; stroke: #000000; stroke-width: 2.4; }
    .actor-txt { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 14.5px; font-weight: 700; fill: #000000; text-anchor: middle; }
    .assoc-line { stroke: #000000; stroke-width: 1.8; fill: none; }
  </style>
</defs>
<rect width="1500" height="960" fill="#ffffff"/>
<text x="60" y="45" class="title">USE CASE DIAGRAM — SISTEM WASKITA</text>
